name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libegl1 libgles2
      - run: uv sync --frozen
      - name: Lint
        if: matrix.os == 'ubuntu-24.04'
        run: uv run ruff check src tests
      - name: Unit tests (no camera, no models needed)
        run: uv run pytest -q
